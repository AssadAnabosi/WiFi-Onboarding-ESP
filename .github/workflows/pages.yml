name: Installer

# Publishes the browser installer (installer/index.html + ESP Web Tools) to GitHub Pages
# with the factory images of the latest public release (docs/releasing.md#browser-installer).
# Runs when a pre-release is made public, or by hand (Actions → Installer → Run workflow).

on:
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"
  # Bump deliberately; the npm registry checks the package's integrity
  ESP_WEB_TOOLS_VERSION: "10.4.0"

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: utils/requirements.txt

      - name: Install Python tools
        run: pip install -r utils/requirements.txt

      - name: Release to install
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Manual runs take the latest public release (never a pre-release or draft)
          tag="${EVENT_TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}"
          echo "Installing $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Firmware and install manifests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p site/firmware
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.factory.bin' --pattern SHA256SUMS --dir site/firmware
          (cd site/firmware && grep '\.factory\.bin$' SHA256SUMS | sha256sum --check --strict)
          rm site/firmware/SHA256SUMS
          python utils/release.py install site/firmware --tag "$TAG"

      - name: ESP Web Tools
        run: |
          npm pack "esp-web-tools@$ESP_WEB_TOOLS_VERSION" --ignore-scripts --pack-destination "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/esp-web-tools-$ESP_WEB_TOOLS_VERSION.tgz" -C "$RUNNER_TEMP"
          cp -r "$RUNNER_TEMP/package/dist/web" site/esp-web-tools
          cp "$RUNNER_TEMP/package/LICENSE" site/esp-web-tools/LICENSE

      # The device's stylesheet and app.js give the page the same look, header and theme switch
      - name: Page
        run: |
          cp installer/installer.css installer/installer.js site/
          sed "s|{{REPO}}|$GITHUB_REPOSITORY|g" installer/index.html > site/index.html
          mkdir -p site/css site/js
          cp web-interface/css/style.css site/css/
          cp web-interface/js/app.js site/js/
          cp web-interface/favicon.ico site/

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
