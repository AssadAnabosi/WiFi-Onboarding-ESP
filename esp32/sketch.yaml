# One profile per build target, named <chip>-<flash>[-<config>].
# Versions are pinned exactly; bump them deliberately in their own PR.
# Arduino IDE ignores this file: keep docs/local-development.md in sync.
profiles:
  esp32-4mb:
    fqbn: esp32:esp32:esp32:PartitionScheme=no_fs
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - ArduinoJson (7.4.3)
      - Async TCP (3.5.0)
      - ESP Async WebServer (3.12.1)
  esp32-8mb:
    fqbn: esp32:esp32:esp32:FlashSize=8M,PartitionScheme=custom
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - ArduinoJson (7.4.3)
      - Async TCP (3.5.0)
      - ESP Async WebServer (3.12.1)
  esp32-8mb-psram:
    fqbn: esp32:esp32:esp32:FlashSize=8M,PartitionScheme=custom,PSRAM=enabled
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - ArduinoJson (7.4.3)
      - Async TCP (3.5.0)
      - ESP Async WebServer (3.12.1)

default_profile: esp32-4mb
